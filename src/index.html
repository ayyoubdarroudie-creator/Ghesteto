/* ---- calendar ---- */
let calMonth=null, calSel=null;
function calView(){
  if(!state.items.length) return emptyState();
  const t=todayJdn(), tj=d2j(t);
  if(!calMonth){ calMonth={y:tj.jy,m:tj.jm}; calSel=t; }
  const {y,m}=calMonth, len=monthLen(y,m), first=j2d(y,m,1), off=weekday(first);
  const rows=allRows(first+len).filter(r=>r.jy===y&&r.jm===m);
  const byDay={}; rows.forEach(r=>(byDay[r.jd]=byDay[r.jd]||[]).push(r));
  let cells='';
  for(let k=0;k<off;k++) cells+='<span></span>';
  for(let d=1;d<=len;d++){
    const j=first+d-1, rs=byDay[d]||[];
    const colors=[...new Set(rs.map(r=>r.item.color))].slice(0,3);
    const isLate=rs.some(r=>!r.paid&&r.jdn<t), done=rs.length&&rs.every(r=>r.paid);
    cells+=`<button class="day ${j===t?'today':''} ${j===calSel?'sel':''} ${isLate?'late':''} ${done?'alldone':''}" data-act="day" data-j="${j}" aria-label="${fa(d)} ${MONTHS[m-1]}${rs.length?'، '+fa(rs.length)+' سررسید':''}">
      <span class="dn">${fa(d)}</span><span class="dots">${colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`;
  }
  let panel;
  if(calSel!=null&&d2j(calSel).jy===y&&d2j(calSel).jm===m){
    const sd=d2j(calSel).jd, rs=byDay[sd]||[];
    panel=`<h2>${fmtDate(calSel)} <small style="font-weight:500">(${rel(calSel-t)})</small></h2>`+(rs.length?`<div class="card">${rs.map(r=>
      `<div class="row" style="--c:${r.item.color}"><div class="grow tap" data-act="go" data-to="#/item/${r.item.id}"><b>${esc(r.item.title)}</b><small>${rowName(r)}</small></div><div class="amt">${money(r.amount)}</div>${payBtn(r)}</div>`).join('')}</div>`
      :`<div class="empty" style="padding:22px"><p style="margin:0">در این روز سررسیدی نداری.</p></div>`);
  }else panel=`<p class="muted" style="text-align:center;margin-top:18px">روی یک روز بزن تا سررسیدهایش را ببینی.</p>`;
  const total=sum(rows), left=sum(rows.filter(r=>!r.paid));
  return `<div class="calhead">
      <button class="back" data-act="calnav" data-d="-1" aria-label="ماه قبل">›</button>
      <h1>${MONTHS[m-1]} ${fa(y)}</h1>
      <button class="back" data-act="calnav" data-d="1" aria-label="ماه بعد">‹</button>
    </div>
    <div class="stats" style="grid-template-columns:1fr 1fr;margin:0 0 12px">
      <div class="stat"><small>مجموع سررسیدهای این ماه</small><b>${money(total)}</b></div>
      <div class="stat ${left?'':'ok'}"><small>باقی‌مانده</small><b>${left?money(left):'همه پرداخت شده'}</b></div></div>
    <div class="card cal"><div class="wk">${WEEK.map(w=>`<span>${w}</span>`).join('')}</div><div class="days">${cells}</div></div>
    ${(calMonth.y!==tj.jy||calMonth.m!==tj.jm)?`<div style="text-align:center;margin-top:10px"><button class="chip" data-act="caltoday">برگشت به امروز</button></div>`:''}
    ${panel}`;
}

/* ---- report ---- */
function reportView(){
  if(!state.items.length) return emptyState();
  const t=todayJdn(), cur=d2j(t), curKey=cur.jy*12+cur.jm-1;
  const rows=allRows();
  const dRows=rows.filter(isDebtRow);
  const unpaid=dRows.filter(r=>!r.paid), paidRows=dRows.filter(r=>r.paid);
  const totalAll=sum(dRows), paidSum=sum(paidRows), left=sum(unpaid);
  const lastJ=unpaid.length?Math.max(...unpaid.map(r=>r.jdn)):null;
  const opens=state.items.filter(openEnded);
  const fixedMonthly=opens.reduce((s,it)=>s+it.installment/(it.every||1),0);
  const stats=`<div class="stats" style="grid-template-columns:1fr 1fr">
    <div class="stat"><small>مجموع تعهدات دارای پایان</small><b>${money(totalAll)}</b></div>
    <div class="stat ok"><small>پرداخت‌شده</small><b>${money(paidSum)}</b></div>
    <div class="stat"><small>باقی‌مانده</small><b>${money(left)}</b></div>
    <div class="stat"><small>پایان همهٔ تعهدات</small><b>${lastJ?fmtDate(lastJ):'تسویه شده'}</b></div>
    ${opens.length?`<div class="stat" style="grid-column:1/-1"><small>هزینهٔ ثابت ماهانهٔ بدون پایان (مثل شارژ)</small><b>${money(fixedMonthly)} <small style="display:inline">تومان در ماه، میانگین</small></b></div>`:''}</div>
    <div class="bar" style="margin-top:12px"><i style="width:${totalAll?Math.round(paidSum/totalAll*100):0}%"></i></div>
    <div class="hint">${fa(totalAll?Math.round(paidSum/totalAll*100):0)}٪ از کل تعهدات دارای پایان پرداخت شده است.</div>`;

  const key=r=>r.jy*12+r.jm-1;
  const keys=rows.map(key), minK=Math.min(...keys), maxK=Math.max(...keys);
  const startK=Math.max(minK,curKey-6), endK=Math.min(maxK,startK+47);
  const cols=[]; for(let k=startK;k<=Math.max(startK,endK);k++) cols.push({k,y:div(k,12),m:mod(k,12)+1,p:0,u:0});
  rows.forEach(r=>{const c=cols.find(x=>x.k===key(r)); if(c){ if(r.paid) c.p+=r.amount; else c.u+=r.amount; }});
  const mx=Math.max(...cols.map(c=>c.p+c.u),1);
  const monthly=`<h2>سررسیدهای هر ماه</h2><div class="card"><div class="chart" id="mchart" role="img" aria-label="نمودار سررسیدهای ماهانه، پرداخت‌شده و پرداخت‌نشده">${cols.map(c=>{
    const ph=Math.round(c.p/mx*90), uh=Math.round(c.u/mx*90);
    return `<div class="col ${c.k===curKey?'cur':''}"><div class="v">${c.p+c.u?compact(c.p+c.u):''}</div><div class="stk" style="height:${Math.max(3,ph+uh)}px"><i class="u" style="height:${uh}px"></i><i class="p" style="height:${ph}px"></i></div><div class="m">${MONTHS[c.m-1]}</div><div class="y">${fa(c.y)}</div></div>`;}).join('')}</div>
    <div class="legend"><span><i style="background:var(--gold)"></i>پرداخت‌شده</span><span><i style="background:var(--bar)"></i>در انتظار</span></div></div>`;

  let line='';
  if(unpaid.length){
    const idx=r=>Math.max(0,(r.jy-cur.jy)*12+(r.jm-cur.jm));
    const N=Math.max(...unpaid.map(idx))+1, buckets=Array(N).fill(0);
    unpaid.forEach(r=>buckets[idx(r)]+=r.amount);
    const vals=[left]; buckets.forEach(b=>vals.push(vals[vals.length-1]-b));
    const W=360,H=170,pl=10,pr=10,pt=24,pb=28, iw=W-pl-pr, ih=H-pt-pb;
    const pts=vals.map((v,k)=>[W-pr-(N?k/N:0)*iw, pt+(1-(left?v/left:0))*ih]);
    const d=pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`;
    const endD=d2j(Math.max(...unpaid.map(r=>r.jdn)));
    line=`<h2>روند کاهش بدهی</h2><div class="card line"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار کاهش بدهی تا پایان تعهدات">
      <path d="${area}" fill="var(--gold)" opacity=".2"/>
      <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--line)"/>
      <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="5" fill="var(--bar)" stroke="var(--gold)" stroke-width="2"/>
      <text x="${pl}" y="14" font-size="11" fill="var(--muted)">اکنون: ${money(left)} تومان</text>
      <text x="${W-pr}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">${MONTHS[cur.jm-1]} ${fa(cur.jy)}</text>
      <text x="${pl}" y="${H-8}" text-anchor="start" font-size="11" fill="var(--muted)">${MONTHS[endD.jm-1]} ${fa(endD.jy)}</text>
    </svg></div>`;
  }

  const byCat={};
  unpaid.forEach(r=>{const c=r.item.cat||'other'; byCat[c]=(byCat[c]||0)+r.amount;});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const catHtml=cats.length?`<h2>بدهی باقی‌مانده به تفکیک دسته</h2><div class="card">${cats.map(([id,v])=>{
    const p=Math.round(v/left*100);
    return `<div class="catrow"><div class="t"><span>${esc(catName(id))}</span><span><b>${money(v)}</b> <small>(${fa(p)}٪)</small></span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;}).join('')}</div>`:'';
  const byKind={};
  unpaid.forEach(r=>{const k=r.item.kind||'loan'; byKind[k]=(byKind[k]||0)+r.amount;});
  const kinds=Object.entries(byKind).sort((a,b)=>b[1]-a[1]);
  const kindHtml=kinds.length>1?`<h2>بدهی باقی‌مانده به تفکیک نوع</h2><div class="card">${kinds.map(([k,v])=>{
    const p=Math.round(v/left*100);
    return `<div class="catrow"><div class="t"><span>${KINDS[k].label}</span><span><b>${money(v)}</b> <small>(${fa(p)}٪)</small></span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;}).join('')}</div>`:'';
  return `${head('گزارش')}${stats}${monthly}${line}${kindHtml}${catHtml}`;
}

// Native share sheet for the backup file (Filesystem + Share plugins). Returns true when handled.
async function nativeShareFile(text){
  try{
    const P=window.Capacitor&&window.Capacitor.Plugins;
    if(!P||!P.Filesystem||!P.Share) return false;
    const name=`aghsat-backup-${new Date().toISOString().slice(0,10)}.txt`;
    const r=await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
    await P.Share.share({title:'پشتیبان اقساط',text:'پشتیبان برنامهٔ مدیریت اقساط',url:r.uri,dialogTitle:'ذخیره یا ارسال پشتیبان'});
    return true;
  }catch(e){ return /cancel/i.test(String((e&&e.message)||e)); }
}
const backupText=()=>JSON.stringify({app:'aghsat',version:5,exported:new Date().toISOString(),...state},null,1);
function parseBackup(text){
  const a=text.indexOf('{'), b=text.lastIndexOf('}');
  if(a<0||b<a) throw new Error('bad');
  const d=JSON.parse(text.slice(a,b+1));
  if(!Array.isArray(d.items)) throw new Error('bad');
  return d;
}
async function applyBackup(data){

}

function readCustomRows(){
  const out=[];
  for(const el of document.querySelectorAll('#crows .crow')){
    const y=numOf(el.querySelector('.c-y')), m=+el.querySelector('.c-m').value, d=+el.querySelector('.c-d').value, a=numOf(el.querySelector('.c-a'));
    if(y<1300||y>1600) return {err:'سال یکی از سررسیدها درست نیست.'};
    if(a<=0) return {err:'مبلغ همهٔ سررسیدها را وارد کن.'};
    out.push({j:j2d(y,m,Math.min(d,monthLen(y,m))),a,ref:el.querySelector('.c-r').value.trim(),paid:+el.dataset.paid||null});
  }
  if(!out.length) return {err:'حداقل یک سررسید اضافه کن.'};
  out.sort((x,y)=>x.j-y.j);
  return {rows:out};
}
function readForm(){
  const f=$('#form'), kind=f.querySelector('[name=kind]:checked').value, mode=formMode();
  const title=$('#f-title').value.trim();
  if(!title) return {err:'عنوان را وارد کن.'};
  const base={kind,title,lender:$('#f-lender').value.trim(),cat:$('#f-cat').value,
    principal:['loan','qard','purchase'].includes(kind)?numOf($('#f-principal')):0,
    note:$('#f-note').value.trim(),color:f.querySelector('[name=color]:checked').value,
    mode:mode==='rec'?'recurring':mode};
  if(mode==='custom'){
    const r=readCustomRows(); if(r.err) return r;
    const d=d2j(r.rows[0].j);
    return {data:{...base,rows:r.rows.map(({j,a,ref})=>({j,a,ref})),paid:r.rows.map(x=>x.paid),count:r.rows.length,installment:0,every:1,first:{y:d.jy,m:d.jm,d:d.jd}}};
  }
  const count=Math.round(numOf($('#f-count'))), inst=numOf($('#f-inst'));
  const y=numOf($('.f-y')), m=+$('.f-m').value, d=+$('.f-d').value;
  if(mode==='regular'&&(count<1||count>600)) return {err:'تعداد اقساط باید بین ۱ تا ۶۰۰ باشد.'};
  if(mode==='rec'&&count>600) return {err:'تعداد دوره‌ها حداکثر ۶۰۰ است.'};
  if(inst<=0) return {err:mode==='rec'?'مبلغ هر دوره را وارد کن.':'مبلغ هر قسط را وارد کن.'};
  if(y<1300||y>1600) return {err:'سال را درست وارد کن (مثلاً ۱۴۰۵).'};
  return {data:{...base,count,installment:inst,every:mode==='rec'?+$('#f-every').value:1,first:{y,m,d}}};
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='closesheet'){ if(b.id==='sheet'&&e.target!==b) return; closeSheet(); return; }
  if(act==='setui'){
    const u=UIS.find(x=>x.id===b.dataset.ui); if(!u) return;
    state.settings.ui=u.id; applyTheme(); await commit(); toast(`سبک «${u.name}» فعال شد.`); return;
  }
  if(act==='go'){ location.hash=b.dataset.to; return; }
  if(act==='filter'){ listCat=b.dataset.cat; render(); return; }
  if(act==='filterkind'){ listKind=b.dataset.kind; render(); return; }
  if(act==='calnav'){ let {y,m}=calMonth; m+=+b.dataset.d; if(m>12){m=1;y++;} if(m<1){m=12;y--;} calMonth={y,m}; calSel=null; render(); return; }
  if(act==='caltoday'){ calMonth=null; render(); return; }
  if(act==='day'){ calSel=+b.dataset.j; render(); return; }
  if(act==='pay'){
    const it=state.items.find(x=>x.id===b.dataset.id); if(!it) return;
    const i=+b.dataset.i; it.paid=it.paid||[]; const was=it.paid[i]||null;
    it.paid[i]=was?null:todayJdn();
    await commit();
    const r=schedule(it)[i];
    toast(was?'پرداخت لغو شد.':`${r?rowNameRaw(r):'پرداخت'} «${it.title}» ثبت شد.`,async()=>{it.paid[i]=was;await commit();});
  }
  if(act==='editrow'){
    const it=state.items.find(x=>x.id===b.dataset.id); if(!it) return;
    ctx={type:'row',id:it.id,i:+b.dataset.i}; openSheet(rowSheet(it,ctx.i));
  }
  if(act==='saverow'){
    const it=state.items.find(x=>x.id===ctx.id), i=ctx.i;
    const amt=numOf($('#r-amt')), y=numOf($('.r-y')), m=+$('.r-m').value, d=+$('.r-d').value;
    if(amt<=0){ toast('مبلغ را وارد کن.'); return; }
    if(y<1300||y>1600){ toast('سال را درست وارد کن.'); return; }
    const j=j2d(y,m,Math.min(d,monthLen(y,m)));
    if(isCustom(it)){
      const ref=($('#r-ref')||{value:''}).value.trim();
      it.paid=it.paid||[];
      if(i<0){ it.rows.push({j,a:amt,ref}); it.paid.push(null); } else it.rows[i]={j,a:amt,ref};
      sortCustom(it);
    }else{
      ensureArrays(it);
      it.amts[i]=amt===it.installment?null:amt;
      it.dates[i]=j===baseJdn(it,i)?null:j;
    }
    closeSheet(); await commit(); toast('ذخیره شد.');
  }
  if(act==='resetrow'){
    const it=state.items.find(x=>x.id===ctx.id), i=ctx.i; ensureArrays(it);
    it.amts[i]=null; it.dates[i]=null; closeSheet(); await commit();
  }
  if(act==='deldata'){
    const it=state.items.find(x=>x.id===ctx.id), i=ctx.i;
    if(confirm('این سررسید حذف شود؟')){ it.rows.splice(i,1); (it.paid||[]).splice(i,1); it.count=it.rows.length; closeSheet(); await commit(); }
  }
  if(act==='extra'){
    const it=state.items.find(x=>x.id===b.dataset.id); if(!it) return;
    ctx={type:'extra',id:it.id}; openSheet(extraSheet(it));
  }
  if(act==='applyextra'){
    const it=state.items.find(x=>x.id===ctx.id), amount=numOf($('#x-amt')), mode=$('[name=xmode]:checked').value;
    const p=planExtra(it,amount,mode); if(p.err){ toast(p.err); return; }
    const snap=JSON.stringify(it); ensureArrays(it); const t=todayJdn();
    p.ch.forEach(c=>{ if(c.clear) it.paid[c.i]=t; else setAmt(it,c.i,c.amt); });
    it.log=it.log||[]; it.log.push({t,amount,mode});
    closeSheet(); await commit();
    toast('پرداخت مازاد ثبت شد.',async()=>{restore(it,snap);await commit();});
  }
  if(act==='settle'){
    const it=state.items.find(x=>x.id===b.dataset.id);
    if(it&&confirm('همهٔ اقساط باقی‌مانده پرداخت‌شده ثبت شود؟')){ const t=todayJdn(); ensureArrays(it); const n=nRows(it); for(let i=0;i<n;i++) if(!it.paid[i]) it.paid[i]=t; await commit(); }
  }
  if(act==='del'){
    const it=state.items.find(x=>x.id===b.dataset.id);
    if(it&&confirm(`«${it.title}» حذف شود؟ این کار قابل بازگشت نیست.`)){ state.items=state.items.filter(x=>x!==it); await saveState(); location.hash='#/list'; }
  }
  if(act==='calc'){
    const P=numOf($('#f-principal')), n=Math.round(numOf($('#f-count'))), rate=numOf($('#f-rate'));
    if(P<=0||n<1||!$('#f-rate').value){ toast('مبلغ وام، تعداد اقساط و نرخ سود را وارد کن.'); return; }
    const r=rate/1200, pmt=r===0?P/n:P*r/(1-Math.pow(1+r,-n));
    $('#f-inst').value=money(pmt);
  }
  if(act==='calcqard'){
    const P=numOf($('#f-principal')), n=Math.round(numOf($('#f-count')));
    if(P<=0||n<1){ toast('مبلغ وام و تعداد اقساط را وارد کن.'); return; }
    $('#f-inst').value=money(P/n);
  }
  if(act==='addcrow'){
    const box=$('#crows'), last=box.lastElementChild; let j=todayJdn(), a=0;
    if(last){ const y=numOf(last.querySelector('.c-y')), m=+last.querySelector('.c-m').value, d=+last.querySelector('.c-d').value; j=j2d(y,m,Math.min(d,monthLen(y,m)))+30; a=numOf(last.querySelector('.c-a')); }
    box.insertAdjacentHTML('beforeend',crowHtml({j,a,ref:'',paid:null})); updateCTotal();
    box.lastElementChild.querySelector('.c-a').focus();
  }
  if(act==='delcrow'){
    const box=$('#crows');
    if(box.children.length<=1){ toast('حداقل یک سررسید لازم است.'); return; }
    b.closest('.crow').remove(); updateCTotal();
  }
  if(act==='save'){
    const {err,data}=readForm(); if(err){ toast(err); return; }
    const id=$('#form').dataset.id;
    if(id){
      const it=state.items.find(x=>x.id===id), oldMode=modeOf(it);
      if(data.mode!==oldMode&&data.mode!=='custom'&&(it.paid||[]).some(Boolean)&&!confirm('با تغییر شیوهٔ زمان‌بندی، وضعیت پرداخت‌های قبلی پاک می‌شود. ادامه می‌دهی؟')) return;
      if(data.mode==='custom'){
        Object.assign(it,data,{amts:[],dates:[]});
      }else if(data.mode!==oldMode){
        Object.assign(it,data,{paid:[],amts:[],dates:[]}); delete it.rows;
      }else{
        ensureArrays(it);
        const rowsOld=schedule(it);
        const instChanged=data.installment!==it.installment;
        const firstChanged=JSON.stringify(data.first)!==JSON.stringify(it.first)||data.every!==(it.every||1);
        const len=data.count?data.count:Math.max(it.paid.length,rowsOld.length);
        const paid=Array.from({length:len},(_,i)=>it.paid[i]||null);
        const amts=Array.from({length:len},(_,i)=>instChanged?((paid[i]&&rowsOld[i])?rowsOld[i].amount:null):(it.amts[i]??null));
        const dates=Array.from({length:len},(_,i)=>firstChanged?null:(it.dates[i]??null));
        Object.assign(it,data,{paid,amts,dates});
      }
      await saveState(); location.hash='#/item/'+id;
    }else{
      const it={id:uid(),...data,paid:data.mode==='custom'?data.paid:[],amts:[],dates:[],log:[]};
      state.items.push(it); await saveState(); location.hash='#/item/'+it.id;
    }
  }
  if(act==='addcat'){
    const inp=$('#new-cat'), name=inp.value.trim();
    if(!name){ toast('نام دسته را وارد کن.'); return; }
    if(state.cats.some(c=>c.name===name)){ toast('این دسته از قبل وجود دارد.'); return; }
    state.cats.push({id:uid(),name}); await commit();
  }
  if(act==='delcat'){
    const c=state.cats.find(x=>x.id===b.dataset.id);
    if(c&&confirm(`دستهٔ «${c.name}» حذف شود؟ تعهدهای آن به «سایر» منتقل می‌شوند.`)){
      state.items.forEach(i=>{ if(i.cat===c.id) i.cat='other'; });
      state.cats=state.cats.filter(x=>x!==c); await commit();
    }
  }
  if(act==='exportfile'){
    const text=backupText();
    if(IS_NATIVE&&await nativeShareFile(text)) return;
    const file=new File([text],`aghsat-backup-${new Date().toISOString().slice(0,10)}.txt`,{type:'text/plain'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'پشتیبان اقساط'}); return; }
    }catch(err){ if(err&&err.name==='AbortError') return; }
    ctx={type:'bk'}; openSheet(backupSheet());
    toast('ارسال فایل در این دستگاه ممکن نشد. متن را کپی کن یا فایل را دانلود کن.');
    return;
  }
  if(act==='exporttext'){
    const text=backupText();
    try{ await navigator.clipboard.writeText(text); toast('متن پشتیبان کپی شد. جایی امن نگهش دار.'); return; }catch(_){}
    ctx={type:'bk'}; openSheet(backupSheet()); return;
  }
  if(act==='copybk'){
    const el=$('#bk-text'); const ok=await copyText(el.value,el);
    toast(ok?'متن پشتیبان کپی شد.':'کپی خودکار نشد. متن را نگه دار و «انتخاب همه» و «کپی» را بزن.'); return;
  }
  if(act==='dlbk'){ const t=$('#bk-text').value; if(IS_NATIVE&&await nativeShareFile(t)) return; downloadBackup(t); return; }
  if(act==='pastetext'){ ctx={type:'rs'}; openSheet(restoreSheet()); return; }
  if(act==='readclip'){
    try{ $('#rs-text').value=await navigator.clipboard.readText(); }
    catch(_){ toast('دسترسی به کلیپ‌بورد داده نشد. متن را خودت در کادر بچسبان.'); }
    return;
  }
  if(act==='applypaste'){
    try{ await applyBackup(parseBackup($('#rs-text').value)); }
    catch(_){ toast('متن پشتیبان معتبر نیست.'); }
    return;
  }
  if(act==='reset'){
    if(confirm('همهٔ تعهدات و تنظیمات حذف شود؟ بهتر است اول پشتیبان بگیری.')){ state=freshState(); applyTheme(); await commit(); toast('همه‌چیز پاک شد.'); }
  }
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.name==='kind'&&$('#form')){
    const cnt=$('#f-count');
    if(t.value==='recurring'&&cnt.value===fa(12)&&!$('#form').dataset.id) cnt.value='';
    if(t.value!=='recurring'&&!cnt.value) cnt.value=fa(12);
    syncForm();
  }
  if(t.id==='f-custom') syncForm();
  if(t.name==='xmode') updatePreview();
  if(t.dataset.set){
    state.settings[t.dataset.set]=t.dataset.set==='remind'?+t.value:t.value; applyTheme(); await saveState();
  }
  if(t.id==='file'&&t.files[0]){
    try{ await applyBackup(parseBackup(await t.files[0].text())); }
    catch(_){ toast('فایل پشتیبان معتبر نیست.'); }
    t.value='';
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-color-pick'){
    const r=$('#color-custom'); r.value=t.value; r.checked=true;
    $('#color-custom-sp').style.setProperty('--c',t.value); $('#color-custom-wrap').hidden=false;
  }
  if(t.dataset&&t.dataset.money!==undefined){ const v=norm(t.value).replace(/\D/g,''); t.value=v?money(+v):''; }
  if(t.id==='x-amt') updatePreview();
  if(t.classList&&t.classList.contains('c-a')) updateCTotal();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });


/* ================= boot ================= */
(async()=>{
  const saved=await loadState();
  if(saved) state=adopt(saved);
  applyTheme(); render();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&!IS_NATIVE){
    const had=!!navigator.serviceWorker.controller; let reloading=false;
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had&&!reloading){ reloading=true; location.reload(); } });
  }
})();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !$('#form') && !$('#sheet.open')) render(); });
</script>
