name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release when you push a tag like v1.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Optional: your own signing key (see README). Leave the secrets empty to use the bundled sideload key.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install the Vazirmatn font (optional)
        run: npm install --no-save --no-audit --no-fund vazirmatn || echo "Font package skipped"

      - name: Prepare web files
        run: node scripts/prepare-www.js

      - name: Add the Android platform
        run: npx cap add android

      - name: Generate launcher icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Patch the Android project
        run: node scripts/patch-android.js

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign the APK
        run: |
          set -euo pipefail
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          TOOLS="$ANDROID_HOME/build-tools/$BT"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            KS="$RUNNER_TEMP/release.keystore"
            KS_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Signing with your own keystore."
          else
            KS="keystore/aghsat-sideload.keystore"
            KS_PASS="aghsat-sideload"
            ALIAS="aghsat"
            KEY_PASS="aghsat-sideload"
            echo "Signing with the bundled sideload keystore."
          fi
          IN="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p dist
          "$TOOLS/zipalign" -p -f 4 "$IN" dist/aligned.apk
          "$TOOLS/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" --out dist/aghsat.apk dist/aligned.apk
          "$TOOLS/apksigner" verify --print-certs dist/aghsat.apk
          rm -f dist/aligned.apk dist/aghsat.apk.idsig

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aghsat-apk
          path: dist/aghsat.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aghsat.apk
