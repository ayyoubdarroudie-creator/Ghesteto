name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      for_store:
        description: "Build for Cafe Bazaar / Google Play (requires your own signing key in Secrets)"
        type: boolean
        default: false

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release when you push a tag like v1.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # true only when you run the workflow by hand and tick "for_store"
      STORE_BUILD: ${{ inputs.for_store == true && 'true' || 'false' }}
      OUT_NAME: ${{ inputs.for_store == true && 'aghsat-store.apk' || 'aghsat.apk' }}
      # Your own signing key (see README). Required for store builds; optional for personal installs.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install the Vazirmatn font (optional)
        run: npm install --no-save --no-audit --no-fund vazirmatn || echo "Font package skipped"

      - name: Prepare web files
        run: node scripts/prepare-www.js

      - name: Add the Android platform
        run: npx cap add android

      - name: Generate launcher icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Patch the Android project
        run: node scripts/patch-android.js

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align, sign and check the APK
        run: bash scripts/sign-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aghsat-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
