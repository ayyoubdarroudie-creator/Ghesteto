name: Create signing key (one time, private repositories only)

# Use this only if you cannot install Java on your computer.
# It creates your signing key inside GitHub and gives it to you as a download that is deleted after 1 day.
# It REFUSES to run on public repositories, because anyone could download the key there.

on:
  workflow_dispatch:
    inputs:
      common_name:
        description: "Name written inside the key (letters, digits and spaces only)"
        type: string
        default: "Aghsat"

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse on public repositories
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "::error::This repository is PUBLIC. Make it private first (Settings > General > Danger Zone > Change visibility), or create the key on your own computer with scripts/make-keystore.sh."
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the key
        env:
          CN_INPUT: ${{ inputs.common_name }}
        run: |
          set -euo pipefail
          CN="$(printf '%s' "$CN_INPUT" | tr -cd 'A-Za-z0-9 ')"
          CN="${CN:-Aghsat}"
          PASS="$(openssl rand -hex 12)"
          mkdir -p out
          keytool -genkeypair -keystore out/my-release.keystore -storetype PKCS12 -alias aghsat \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=$CN, O=$CN, C=IR"
          base64 out/my-release.keystore | tr -d '\n' > out/keystore.b64
          {
            echo "Create these repository secrets (Settings > Secrets and variables > Actions):"
            echo
            echo "ANDROID_KEYSTORE_PASSWORD = $PASS"
            echo "ANDROID_KEY_ALIAS         = aghsat"
            echo "ANDROID_KEY_PASSWORD      = (do not create this secret, it is the same as the password above)"
            echo "ANDROID_KEYSTORE_BASE64   = the whole content of keystore.b64 (one long line)"
          } > out/secrets.txt
          keytool -list -keystore out/my-release.keystore -storepass "$PASS" | tail -3

      - name: Upload (kept for 1 day only)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-DELETE-AFTER-DOWNLOAD
          path: out/
          retention-days: 1
